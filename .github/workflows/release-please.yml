name: Release Workflow
on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 📖
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # release-please has no assignees option, so the release PR is assigned to the repo owner here.
      # Runs whenever the PR was created or updated; adding an assignee that is already set is a no-op.
      - name: Assign release PR to the repo owner 👤
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          number=$(jq -r '.number' <<< "$PR_JSON")
          gh api "repos/$GITHUB_REPOSITORY/issues/$number/assignees" \
            --method POST \
            --field "assignees[]=$GITHUB_REPOSITORY_OWNER"

      - name: Install pnpm ⚙️ # version read from packageManager in package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ steps.release.outputs.release_created }}

      - name: Use Node.js ⚙️ 24
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Same approach as nodejs.yml: the store path comes from `pnpm store path`,
      # so no `pnpm config set store-dir` or setup-node `cache: pnpm` is needed.
      - name: Resolve pnpm store path ⚙️
        if: ${{ steps.release.outputs.release_created }}
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies 🔒
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('package.json', 'pnpm-workspace.yaml') }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('.github/workflows/release-please.yml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies 📦
        if: ${{ steps.release.outputs.release_created }}
        run: |
          pnpm install --frozen-lockfile

      - name: Build 🏗️
        if: ${{ steps.release.outputs.release_created }}
        run: |
          node --run build && find ./bin/index.js

      - name: Verify before publishing ✅
        if: ${{ steps.release.outputs.release_created }}
        run: |
          node --run lint
          node --run typecheck
          node --run test

      - name: Publish to npm 🚀
        if: ${{ steps.release.outputs.release_created }}
        run: |
          pnpm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
