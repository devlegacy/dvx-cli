name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: dvx version
      description: Output of `dvx --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node.js version and OS
      placeholder: Node 24.x, macOS 15 arm64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: sh
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened and what you expected
      description: Include the error output. Use `DVX_LOG_LEVEL=debug` for more detail.
    validations:
      required: true
