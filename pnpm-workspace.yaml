allowBuilds:
  "@swc/core": true
  gifsicle: true
  jpegtran-bin: true
  mozjpeg: true
  pngquant-bin: true
  sharp: true
  zopflipng-bin: true
engineStrict: true
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
overrides:
  braces@<3.0.3: ">=3.0.3"
  cross-spawn@<6.0.6: ">=6.0.6"
  decompress@<4.2.1: ">=4.2.1"
  file-type@>=13.0.0 <21.3.1: ">=21.3.1"
  got@<11.8.5: ">=11.8.5"
  download>got: "7.1.0"
  http-cache-semantics@<4.1.1: ">=4.1.1"
  micromatch@<4.0.8: ">=4.0.8"
  semver-regex@<3.1.4: ">=3.1.4"
  semver@>=2.0.0-alpha <5.7.2: ">=5.7.2"
  trim-newlines@<3.0.1: ">=3.0.1"
  tunnel-agent@<0.6.0: ">=0.6.0"
  uuid@<14.0.0: ">=14.0.0"
saveExact: true
# A log that never rewrites the terminal (readable in CI).
reporter: append-only
# Bounded registry requests in flight.
networkConcurrency: 8
